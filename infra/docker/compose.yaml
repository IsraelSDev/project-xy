# Dependências locais de desenvolvimento. Rode pela raiz: `pnpm db:up` (lê o .env da raiz).
name: 3dxchat-web

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # Exposto só no loopback: o banco não fica acessível pela rede local.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do Postgres 18 a imagem usa /var/lib/postgresql como ponto de montagem.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
