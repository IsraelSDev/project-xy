<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3DXChat — closet</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1218;
        --panel: #151b24;
        --panel-2: #1b2430;
        --line: #2a3645;
        --text: #dbe4ef;
        --muted: #8ea0b5;
        --accent: #7dd3fc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.35 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #hud {
        position: fixed;
        left: 14px;
        bottom: 42px;
        max-width: min(62vw, 560px);
        padding: 8px 10px;
        color: var(--muted);
        background: #0e1218b8;
        border: 1px solid #2a364566;
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }
      #hud strong {
        color: var(--text);
        font-weight: 600;
      }
      #status {
        position: fixed;
        left: 14px;
        bottom: 14px;
        padding: 4px 8px;
        color: var(--muted);
        background: #0e1218b8;
        border-radius: 6px;
        font-size: 12px;
        pointer-events: none;
        user-select: none;
      }
      .focus-bar {
        position: fixed;
        top: 12px;
        left: 14px;
        z-index: 4;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        max-width: calc(100% - 360px);
        padding: 8px;
        background: #0e1218b8;
        border: 1px solid #2a364566;
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      .focus-bar .focus-label {
        margin-right: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .focus-bar button {
        padding: 5px 8px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        white-space: nowrap;
      }
      .focus-bar button:hover {
        border-color: #46617e;
      }
      .focus-bar button.primary {
        border-color: #2f6f8f;
        background: #163445;
        color: #d9f4ff;
      }
      @media (max-width: 760px) {
        .focus-bar {
          right: 10px;
          max-width: none;
        }
      }
      #err {
        position: fixed;
        left: 14px;
        bottom: 34px;
        max-width: min(70vw, 700px);
        color: #fca5a5;
        font:
          12px/1.35 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 318px;
        overflow: auto;
        padding: 14px 14px 22px;
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border-left: 1px solid var(--line);
        backdrop-filter: blur(8px);
        z-index: 5;
      }
      #panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      #panel h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      #panel h1 span {
        color: var(--accent);
      }
      #panel header .back {
        padding: 5px 8px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        white-space: nowrap;
      }
      #panel header .back:hover {
        border-color: #46617e;
      }
      #panelToggle {
        display: none;
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 6;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 7px;
        padding: 6px 9px;
        font: inherit;
      }
      section {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      section:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      section h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .row {
        display: grid;
        grid-template-columns: 88px 1fr;
        align-items: center;
        gap: 8px;
        margin: 7px 0;
      }
      .row > label {
        color: var(--muted);
        font-size: 12px;
      }
      select,
      input[type='range'],
      button {
        font: inherit;
      }
      select {
        width: 100%;
        min-width: 0;
        padding: 6px 7px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: none;
      }
      select:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      .value {
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .swatch {
        width: 22px;
        height: 22px;
        padding: 0;
        border-radius: 5px;
        border: 1px solid #0006;
        box-shadow: inset 0 0 0 1px #ffffff1a;
        cursor: pointer;
      }
      .swatch.selected {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .buttons button {
        flex: 1 1 auto;
        min-width: 74px;
        padding: 6px 8px;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      .buttons button:hover {
        border-color: #46617e;
      }
      .buttons button.primary {
        border-color: #2f6f8f;
        background: #163445;
        color: #d9f4ff;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      .note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      .note code {
        color: var(--text);
      }
      @media (max-width: 760px) {
        #panel {
          width: min(88vw, 330px);
          transform: translateX(100%);
          transition: transform 160ms ease;
        }
        #panel.open {
          transform: none;
        }
        #panelToggle {
          display: block;
        }
        #hud {
          max-width: calc(100vw - 90px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <strong>Closet 3DX — Home</strong><br />
      câmera fixa · focos no topo · troque cabelo/roupa/cores · clique para play/pause
    </div>
    <div id="status"></div>
    <div id="err"></div>
    <button id="panelToggle" type="button">Opções</button>
    <div id="focusBar" class="focus-bar" role="group" aria-label="Foco da câmera"></div>
    <aside id="panel">
      <header>
        <h1>Closet <span>3DX</span></h1>
        <button id="back" class="back" type="button">Voltar ao jogo</button>
      </header>
      <div id="controls"></div>
    </aside>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script>
      // ---------------------------------------------------------------------------
      // Catálogo local (mesma fonte de `packages/contracts/src/avatar.ts`).
      // Os itens novos do 3DX entram aqui para aparecer no painel.
      // ---------------------------------------------------------------------------
      const MODELS = {

            ],

              {
                id: '3dx_m_outerwear_cardigan',

              {

              {

          },
          parts: {

              { id: '3dx_f_hair_30', label: 'Longo ondulado', file: 'hair/3dx_f_hair_30.glb' },
            ],
            top: [
              { id: 'none', label: 'Sem camiseta' },
              {

                label: 'Camiseta 3DX',
                file: 'clothes/top/3dx_f_top_shirt.glb',

              {

              },

                file: 'clothes/top/3dx_f_top_offshoulder.glb',

            ],
            outerwear: [
              { id: 'none', label: 'Sem sobreposição' },
              {
                id: '3dx_f_outerwear_coat',
                label: 'Casaco 3DX',
                file: 'clothes/outerwear/3dx_f_outerwear_coat.glb',
                covers: 'all',
              },
            ],
            bottom: [
              { id: 'none', label: 'Sem calça' },
              {
                id: '3dx_f_bottom_pants',
                label: 'Calça jeans 3DX',
                file: 'clothes/bottom/3dx_f_bottom_pants.glb',
              },
              {
                id: '3dx_f_bottom_leggings',
                label: 'Legging 3DX',
                file: 'clothes/bottom/3dx_f_bottom_leggings.glb',

              {

              {

                file: 'clothes/bottom/3dx_f_bottom_skirt_pleated.glb',
              },
              {
                id: '3dx_f_bottom_skirt_short',
                label: 'Minissaia 3DX',

            ],
            underwear: [
              { id: 'none', label: 'Sem roupa íntima' },
              {
                id: '3dx_f_underwear_panties',
                label: 'Calcinha 3DX',
                file: 'clothes/underwear/3dx_f_underwear_panties.glb',
                covers: 'bottom',
              },
              {
                id: '3dx_f_underwear_bra',
                label: 'Sutiã 3DX',
                file: 'clothes/underwear/3dx_f_underwear_bra.glb',
                covers: 'top',
              },
              {
                id: '3dx_f_underwear_bra_lace',
                label: 'Sutiã rendado 3DX',
                file: 'clothes/underwear/3dx_f_underwear_bra_lace.glb',
                covers: 'top',
              },
            ],
          },
        },
      };

      const SKIN_TONES = [
        { id: 'skin-1', label: 'Tom 1', hex: '#f3d7c4' },
        { id: 'skin-2', label: 'Tom 2', hex: '#e0b294' },
        { id: 'skin-3', label: 'Tom 3', hex: '#c68e68' },
        { id: 'skin-4', label: 'Tom 4', hex: '#9c6a48' },
        { id: 'skin-5', label: 'Tom 5', hex: '#6e4630' },
        { id: 'skin-6', label: 'Tom 6', hex: '#4a2f22' },
      ];

      const EYE_COLORS = [
        { id: 'eye-brown', label: 'Castanho', hex: '#4a2f1e' },
        { id: 'eye-honey', label: 'Mel', hex: '#8a5a2b' },
        { id: 'eye-green', label: 'Verde', hex: '#3f6b3a' },
        { id: 'eye-blue', label: 'Azul', hex: '#3f6f9e' },
        { id: 'eye-gray', label: 'Cinza', hex: '#6d7378' },
        { id: 'eye-black', label: 'Preto', hex: '#1a1a1c' },
      ];

      const PALETTE = [        { id: 'black', label: 'Preto', hex: '#1d1d22' },
        { id: 'white', label: 'Branco', hex: '#e8e6e1' },
        { id: 'gray', label: 'Cinza', hex: '#7b7d84' },
        { id: 'brown', label: 'Marrom', hex: '#6b4a32' },
        { id: 'blonde', label: 'Loiro', hex: '#d8b46a' },
        { id: 'red', label: 'Vermelho', hex: '#a8323a' },
        { id: 'blue', label: 'Azul', hex: '#2f5a9e' },
        { id: 'green', label: 'Verde', hex: '#2f7a52' },
        { id: 'purple', label: 'Roxo', hex: '#6a3f9e' },
        { id: 'pink', label: 'Rosa', hex: '#d97aa6' },
      ];

      const ANIMATIONS = [
        { id: 'idle', label: 'Idle (parado)' },
        { id: 'walk', label: 'Walk (andando)' },
        { id: 'pose01', label: 'Pose 1' },
      ];

      const FOCUS = [
        { id: 'full', label: 'Corpo inteiro' },
        { id: 'face', label: 'Rosto' },
        { id: 'profile', label: 'Perfil' },
        { id: 'torso', label: 'Tronco' },
        { id: 'arms', label: 'Braços' },
        { id: 'legs', label: 'Pernas' },
        { id: 'back', label: 'Costas' },
      ];

      const params = new URLSearchParams(location.search);
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const byId = (items, id) => items.find((item) => item.id === id);
      const normalizeModel = (value) => {
        if (value === 'character_male' || value === 'male') return '3dx-male';
        if (value === 'character_female' || value === 'female') return '3dx-female';
        return MODELS[value] ? value : undefined;
      };
      const validPart = (model, slot, id) =>
        id && byId(MODELS[model].parts[slot], id) ? id : 'none';

      const initialModel = normalizeModel(params.get('model')) || '3dx-male';
      const defaults = MODELS[initialModel].defaults;
      const state = {
        model: initialModel,
        anim: ANIMATIONS.some((item) => item.id === params.get('anim'))
          ? params.get('anim')
          : 'idle',
        skin: byId(SKIN_TONES, params.get('skin')) ? params.get('skin') : 'skin-3',
        eyeColor: byId(EYE_COLORS, params.get('eyes')) ? params.get('eyes') : 'eye-brown',
        eyeColorHex: /^#[0-9a-f]{6}$/i.test(params.get('eyeHex') || '')
          ? params.get('eyeHex')
          : undefined,
        height: clamp(Number.parseFloat(params.get('height') || '1') || 1, 0.85, 1.2),
        hair: validPart(initialModel, 'hair', params.get('hair') || defaults.hair),
        hairColor: byId(PALETTE, params.get('hairColor'))
          ? params.get('hairColor')
          : defaults.hairColor,
        top: validPart(initialModel, 'top', params.get('top') || defaults.top),
        topColor: byId(PALETTE, params.get('topColor'))
          ? params.get('topColor')
          : defaults.topColor,
        outerwear: validPart(
          initialModel,
          'outerwear',
          params.get('outerwear') || defaults.outerwear,
        ),
        bottom: validPart(initialModel, 'bottom', params.get('bottom') || defaults.bottom),
        bottomColor: byId(PALETTE, params.get('bottomColor'))
          ? params.get('bottomColor')
          : defaults.bottomColor,
        underwear: validPart(
          initialModel,
          'underwear',
          params.get('underwear') || defaults.underwear,
        ),
        focus: FOCUS.some((item) => item.id === params.get('focus')) ? params.get('focus') : 'full',
      };
      // Compatibilidade com os atalhos antigos do viewer.
      if (params.get('hair') === '0' || params.get('hair') === 'none') state.hair = 'none';
      const outfit = params.get('outfit');
      if (outfit === 'none') {
        state.top = 'none';
        state.outerwear = 'none';
        state.bottom = 'none';
        state.underwear = 'none';
      } else if (['top', 'bottom', 'underwear'].includes(outfit)) {
        state.top = outfit === 'top' ? defaults.top : 'none';
        state.outerwear = 'none';
        state.bottom = outfit === 'bottom' ? defaults.bottom : 'none';
        state.underwear = outfit === 'underwear' ? defaults.underwear : 'none';
      } else if (outfit === 'all') {
        state.top = defaults.top;
        state.outerwear = defaults.outerwear;
        state.bottom = defaults.bottom;
        state.underwear = defaults.underwear;
      }

      const err = document.getElementById('err');
      const hud = document.getElementById('hud');
      const status = document.getElementById('status');
      const controls = document.getElementById('controls');
      const panel = document.getElementById('panel');
      window.addEventListener('error', (event) => {
        err.textContent = String(event.message || event.error);
      });

      const canvas = document.getElementById('app');
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.055, 0.07, 0.095, 1);

      const camera = new BABYLON.FreeCamera('cam', new BABYLON.Vector3(0.35, 1.55, 3.35), scene);
      camera.setTarget(new BABYLON.Vector3(-0.45, 1.05, 0.9));
      camera.fov = 0.72;
      camera.minZ = 0.01;
      let cameraTarget = camera.getTarget().clone();
      let cameraGoal = null;

      const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.8;
      const dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-0.5, -1, -0.4), scene);
      dir.intensity = 0.85;
      const fill = new BABYLON.DirectionalLight('fill', new BABYLON.Vector3(0.6, -0.2, 0.8), scene);
      fill.intensity = 0.35;
      const key = new BABYLON.PointLight('key', new BABYLON.Vector3(-1.2, 2.5, 1.8), scene);
      key.intensity = 0.35;
      key.range = 8;

// O quarto já tem piso; nao criar um ground por cima.

      // ---------------------------------------------------------------------------
      // Carga e montagem
      // ---------------------------------------------------------------------------
      const containerCache = new Map();
      let active = emptyActive();
      let generation = 0;
      let playing = true;

      function emptyActive() {
        return {
          root: null,
          entries: [],
          groups: [],
          bodyMeshes: [],
          bodySkeleton: null,
          baseScale: 1,
          baseMinY: 0,
          parts: [],
        };
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function linear(hex) {
        return BABYLON.Color3.FromHexString(hex).toLinearSpace();
      }

      function colorOf(id) {
        return (byId(PALETTE, id) || PALETTE[0]).hex;
      }

      function skinOf(id) {
        return (byId(SKIN_TONES, id) || SKIN_TONES[2]).hex;
      }

      // Pele mais clara do atlas 3DX por gênero (percentil 95 em luz linear). O tom escolhido é
      // dividido por ela para o swatch continuar sendo a cor final e o atlas entrar só com o detalhe.
      const ATLAS_SKIN = {
        '3dx-male': [0.776, 0.552, 0.445],
        '3dx-female': [0.776, 0.515, 0.462],
      };

      function skinTint() {
        const tint = linear(skinOf(state.skin));
        const atlas = ATLAS_SKIN[state.model] || ATLAS_SKIN['3dx-male'];
        const gain = (value) => Math.min(1.25, value);
        return new BABYLON.Color3(
          gain(tint.r / atlas[0]),
          gain(tint.g / atlas[1]),
          gain(tint.b / atlas[2]),
        );
      }

      function fileOf(model, slot, id) {
        return byId(MODELS[model].parts[slot], id)?.file;
      }

      const PARTS_VERSION = 2;

      async function loadContainer(file) {
        if (!file) throw new Error('arquivo de peça ausente');
        let promise = containerCache.get(file);
        if (!promise) {
          promise = BABYLON.SceneLoader.LoadAssetContainerAsync(
            '/assets/3dx/',
            `${file}?v=${PARTS_VERSION}`,
            scene,
            undefined,
            '.glb',
          ).catch((error) => {
            containerCache.delete(file);
            throw error;
          });
          containerCache.set(file, promise);
        }
        return promise;
      }

      function meshesOf(entries) {
        const found = new Set();
        for (const root of entries.rootNodes) {
          if (root.getTotalVertices && root.getTotalVertices() > 0) found.add(root);
          for (const mesh of root.getChildMeshes(false)) {
            if (mesh.getTotalVertices() > 0) found.add(mesh);
          }
        }
        return [...found];
      }

      function pickSkeleton(skeletons) {
        return skeletons && skeletons.length
          ? skeletons.reduce((best, skeleton) =>
              skeleton.bones.length > best.bones.length ? skeleton : best,
            )
          : undefined;
      }

      function disposeActive() {
        for (const group of active.groups) group.stop();
        for (const entries of [...active.entries].reverse()) entries.dispose();
        active.root?.dispose(false, false);
        active = emptyActive();
      }

      const AVATAR_X = -0.35;
      const AVATAR_Z = 0.95;

      function applyHeight() {
        if (!active.root) return;
        const scale = active.baseScale * state.height;
        active.root.scaling.setAll(scale);
        active.root.position.y = -active.baseMinY * scale;
        active.root.position.x = AVATAR_X;
        active.root.position.z = AVATAR_Z;
        updateFocusGoal();
      }

      function focusPose(id) {
        const h = state.height;
        const x = AVATAR_X;
        const z = AVATAR_Z;
        switch (id) {
          case 'face':
            return {
              position: new BABYLON.Vector3(x + 0.04, 1.55 * h, z + 1.12),
              target: new BABYLON.Vector3(x, 1.52 * h, z),
              fov: 0.5,
            };
          case 'profile':
            return {
              position: new BABYLON.Vector3(x + 1.22, 1.55 * h, z + 0.08),
              target: new BABYLON.Vector3(x, 1.52 * h, z),
              fov: 0.5,
            };
          case 'torso':
            return {
              position: new BABYLON.Vector3(x + 0.08, 1.22 * h, z + 1.55),
              target: new BABYLON.Vector3(x, 1.16 * h, z),
              fov: 0.62,
            };
          case 'arms':
            return {
              position: new BABYLON.Vector3(x + 0.35, 1.22 * h, z + 1.45),
              target: new BABYLON.Vector3(x, 1.1 * h, z),
              fov: 0.66,
            };
          case 'legs':
            return {
              position: new BABYLON.Vector3(x + 0.12, 0.82 * h, z + 1.65),
              target: new BABYLON.Vector3(x, 0.55 * h, z),
              fov: 0.62,
            };
          case 'back':
            return {
              position: new BABYLON.Vector3(x + 0.85, 1.3 * h, z - 1.35),
              target: new BABYLON.Vector3(x, 1.02 * h, z),
              fov: 0.68,
            };
          default:
            return {
              position: new BABYLON.Vector3(0.35, 1.55, 3.35),
              target: new BABYLON.Vector3(-0.45, 1.05, 0.9),
              fov: 0.72,
            };
        }
      }

      function updateFocusGoal() {
        cameraGoal = focusPose(state.focus);
      }

      function refreshFocusButtons() {
        for (const button of document.querySelectorAll('[data-focus]')) {
          button.classList.toggle('primary', button.dataset.focus === state.focus);
        }
      }

      function buildFocusBar() {
        const bar = document.getElementById('focusBar');
        bar.replaceChildren();
        const label = document.createElement('span');
        label.className = 'focus-label';
        label.textContent = 'Foco';
        bar.append(label);
        for (const item of FOCUS) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = item.label;
          button.dataset.focus = item.id;
          button.classList.toggle('primary', state.focus === item.id);
          button.addEventListener('click', () => setFocus(item.id));
          bar.append(button);
        }
      }

      function setFocus(id, immediate = false) {
        state.focus = FOCUS.some((item) => item.id === id) ? id : 'full';
        updateFocusGoal();
        if (immediate && cameraGoal) {
          camera.position.copyFrom(cameraGoal.position);
          cameraTarget.copyFrom(cameraGoal.target);
          camera.setTarget(cameraTarget);
          camera.fov = cameraGoal.fov;
        }
        refreshFocusButtons();
        updateUrl();
      }

      /**
       * Recolore só a íris: o atlas dos olhos é cinza e a esclera (branca) fica fora da máscara.
       * Mesmo shader do jogo (`eye-tint-plugin.ts`).
       */
      class EyeTint extends BABYLON.MaterialPluginBase {
        constructor(material) {
          super(material, 'EyeTint', 200, { EYE_TINT: false });
          this.tint = new BABYLON.Color3(0.29, 0.09, 0.02);
          this.enabled = false;
        }
        get isEnabled() {
          return this.enabled;
        }
        set isEnabled(value) {
          if (this.enabled === value) return;
          this.enabled = value;
          this.markAllDefinesAsDirty();
          this._enable(value);
        }
        getClassName() {
          return 'EyeTint';
        }
        prepareDefines(defines) {
          defines.EYE_TINT = this.enabled;
        }
        getUniforms() {
          return {
            ubo: [{ name: 'eyeTint', size: 3, type: 'vec3' }],
            fragment: '#ifdef EYE_TINT\nuniform vec3 eyeTint;\n#endif',
          };
        }
        bindForSubMesh(uniformBuffer) {
          if (this.enabled) uniformBuffer.updateColor3('eyeTint', this.tint);
        }
        getCustomCode(shaderType) {
          if (shaderType !== 'fragment') return null;
          return {
            CUSTOM_FRAGMENT_UPDATE_ALBEDO: `
#ifdef EYE_TINT
float eyeLuma = dot(surfaceAlbedo, vec3(0.2126, 0.7152, 0.0722));
// A iris e cinza (saturacao ~0) e escura; esclera, dentes e boca sao claros ou coloridos.
float eyeSat = max(max(surfaceAlbedo.r, surfaceAlbedo.g), surfaceAlbedo.b)
             - min(min(surfaceAlbedo.r, surfaceAlbedo.g), surfaceAlbedo.b);
float eyeMask = (1.0 - smoothstep(0.60, 0.75, eyeLuma)) * (1.0 - smoothstep(0.06, 0.14, eyeSat));
surfaceAlbedo = mix(surfaceAlbedo, eyeTint * clamp(0.25 + eyeLuma * 1.5, 0.0, 1.2), eyeMask);
#endif`,
          };
        }
      }

      function applyColors() {
        const skin = skinTint();
        const eyeHex =
          state.eyeColorHex || (byId(EYE_COLORS, state.eyeColor) || EYE_COLORS[0]).hex;
        for (const mesh of active.bodyMeshes) {
          if (!mesh.material || !mesh.material.albedoColor) continue;
          if (/jaw_eyes|eyes_atlas/i.test(mesh.name)) {
            mesh.material.albedoColor = BABYLON.Color3.White();
            if (!mesh.material.__eyeTint) mesh.material.__eyeTint = new EyeTint(mesh.material);
            mesh.material.__eyeTint.tint.copyFrom(linear(eyeHex));
            mesh.material.__eyeTint.isEnabled = true;
            continue;
          }
          mesh.material.albedoColor = /eyelash/i.test(mesh.name) ? BABYLON.Color3.White() : skin;
        }
        const hair = linear(colorOf(state.hairColor)).scale(0.8);
        const top = linear(colorOf(state.topColor));
        const bottom = linear(colorOf(state.bottomColor));
        for (const part of active.parts) {
          const tint =
            part.slot === 'hair'
              ? hair
              : part.slot === 'top' || part.slot === 'outerwear'
                ? top
                : bottom;
          for (const mesh of part.meshes) {
            if (mesh.material && mesh.material.albedoColor) mesh.material.albedoColor = tint;
          }
        }
        // A roupa íntima é uma camada independente: aparece junto com calça/saia e top/blusa. A
        // anatomia masculina some com qualquer peça de baixo.
        const anatomyHidden = state.bottom !== 'none' || state.underwear !== 'none';
        for (const mesh of active.bodyMeshes) {
          if (/penis/i.test(mesh.name)) mesh.isVisible = !anatomyHidden;
        }
      }

      function maximizeTextures() {
        for (const texture of scene.textures) {
          if (!(texture instanceof BABYLON.Texture)) continue;
          texture.anisotropicFilteringLevel = 8;
          texture.updateSamplingMode(BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
        }
      }

      function playAnimation() {
        for (const group of active.groups) group.stop();
        const wanted = active.groups.find(
          (group) => group.name.replace(/^Clone of /, '') === state.anim,
        );
        if (!wanted) {
          for (const group of active.groups) group.start(true, 1);
          return;
        }
        wanted.speedRatio = state.anim === 'walk' ? 1.15 : 1;
        wanted.start(true, 1);
        if (!playing) wanted.pause();
      }

      async function loadRoom() {
        try {
          const container = await BABYLON.SceneLoader.LoadAssetContainerAsync(
            '',
            '/assets/3dx/rooms/home/home.glb',
            scene,
            undefined,
            '.glb',
          );
          container.instantiateModelsToScene(undefined, false);
          maximizeTextures();
          setStatus('Closet carregado · carregando avatar…');
        } catch (error) {
          err.textContent = `Falha ao carregar o closet: ${error?.message || error}`;
        }
      }

      async function reloadAvatar() {
        const token = ++generation;
        setStatus('Carregando avatar…');
        disposeActive();
        const model = MODELS[state.model];
        try {
          const bodyContainer = await loadContainer(model.file);
          if (token !== generation) return;
          const bodyEntries = bodyContainer.instantiateModelsToScene(undefined, false);
          const root = new BABYLON.TransformNode('avatar-root', scene);
          for (const node of bodyEntries.rootNodes) node.parent = root;
          root.computeWorldMatrix(true);
          const bounds = root.getHierarchyBoundingVectors(true);
          const measured = Math.max(0.1, bounds.max.y - bounds.min.y);
          active = {
            root,
            entries: [bodyEntries],
            groups: bodyEntries.animationGroups,
            bodyMeshes: meshesOf(bodyEntries),
            bodySkeleton: pickSkeleton(bodyEntries.skeletons),
            baseScale: 1.7 / measured,
            baseMinY: bounds.min.y,
            parts: [],
          };
          applyHeight();
          root.position.x = -0.35;
          root.position.z = 0.95;
          root.rotation.y = 0;

          const wantedParts = [];
          // Roupa íntima não é desenhada quando a região dela já está coberta (sutiã com
          // top/casaco, calcinha/cueca com calça/saia): ela atravessa o tecido de cima.
          const coveredRegions = new Set();
          if (state.outerwear !== 'none' || state.top !== 'none') coveredRegions.add('top');
          if (state.bottom !== 'none') coveredRegions.add('bottom');
          // Casaco longo (covers: 'all') cobre também a parte de baixo: esconde calcinha/cueca.
          const outerwearItem = byId(MODELS[state.model].parts.outerwear, state.outerwear);
          if (outerwearItem && outerwearItem.covers === 'all') {
            coveredRegions.add('top');
            coveredRegions.add('bottom');
          }
          for (const slot of ['hair', 'top', 'outerwear', 'bottom', 'underwear']) {
            // Casaco e camiseta ocupam a mesma camada (igual ao jogo).
            if (slot === 'top' && state.outerwear !== 'none') continue;
            if (slot === 'underwear') {
              const item = byId(MODELS[state.model].parts.underwear, state.underwear);
              if (item && item.covers && coveredRegions.has(item.covers)) continue;
            }
            const file = fileOf(state.model, slot, state[slot]);
            if (file) wantedParts.push({ slot, file });
          }
          const loaded = await Promise.all(
            wantedParts.map(async ({ slot, file }) => ({
              slot,
              container: await loadContainer(file),
            })),
          );
          if (token !== generation) {
            for (const item of loaded) item.container.dispose();
            return;
          }
          for (const { slot, container } of loaded) {
            const entries = container.instantiateModelsToScene(undefined, false);
            for (const node of entries.rootNodes) {
              if (!node.parent) node.parent = root;
            }
            const meshes = meshesOf(entries);
            for (const mesh of meshes) {
              if (mesh.isVerticesDataPresent(BABYLON.VertexBuffer.MatricesIndicesKind)) {
                mesh.skeleton = active.bodySkeleton;
              }
              // Cabelo/pano é dois lados: sem twoSidedLighting o verso fica preto ("outro cabelo").
              if (mesh.material && mesh.material.backFaceCulling === false) {
                mesh.material.twoSidedLighting = true;
              }
            }
            active.entries.push(entries);
            active.parts.push({ slot, meshes });
          }
          applyColors();
          maximizeTextures();
          playAnimation();
          setStatus(`Pronto · ${model.label} · ${active.bodyMeshes.length} malhas do corpo`);
          updateUrl();
        } catch (error) {
          if (token !== generation) return;
          err.textContent = `Falha ao carregar o avatar: ${error?.message || error}`;
          setStatus('Falhou');
        }
      }

      // ---------------------------------------------------------------------------
      // Painel
      // ---------------------------------------------------------------------------
      function section(title) {
        const element = document.createElement('section');
        const heading = document.createElement('h2');
        heading.textContent = title;
        element.append(heading);
        controls.append(element);
        return element;
      }

      function addSelect(parent, label, key, options, onChange) {
        const row = document.createElement('div');
        row.className = 'row';
        const text = document.createElement('label');
        text.textContent = label;
        const select = document.createElement('select');
        for (const option of options) {
          const item = document.createElement('option');
          item.value = option.id;
          item.textContent = option.label;
          select.append(item);
        }
        select.value = state[key];
        select.addEventListener('change', () => onChange(select.value));
        row.append(text, select);
        parent.append(row);
        return select;
      }

      function addSwatches(parent, label, key, items, onChange) {
        const row = document.createElement('div');
        row.className = 'row';
        const text = document.createElement('label');
        text.textContent = label;
        const box = document.createElement('div');
        box.className = 'swatches';
        for (const item of items) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'swatch';
          button.dataset.swatchKey = key;
          button.dataset.swatchId = item.id;
          button.title = item.label;
          button.setAttribute('aria-label', item.label);
          button.style.background = item.hex;
          if (state[key] === item.id) button.classList.add('selected');
          button.addEventListener('click', () => {
            state[key] = item.id;
            onChange();
          });
          box.append(button);
        }
        row.append(text, box);
        parent.append(row);
      }

      function refreshSwatches() {
        for (const button of controls.querySelectorAll('[data-swatch-key]')) {
          button.classList.toggle(
            'selected',
            state[button.dataset.swatchKey] === button.dataset.swatchId,
          );
        }
      }

      function setModel(model) {
        const nextDefaults = MODELS[model].defaults;
        state.model = model;
        for (const slot of ['hair', 'top', 'outerwear', 'bottom', 'underwear'])
          state[slot] = nextDefaults[slot];
        for (const key of ['hairColor', 'topColor', 'bottomColor']) state[key] = nextDefaults[key];
        buildPanel();
        reloadAvatar();
      }

      function applyPreset(kind) {
        const defaults = MODELS[state.model].defaults;
        if (kind === 'complete') {
          state.hair = defaults.hair;
          state.top = defaults.top;
          state.outerwear = defaults.outerwear;
          state.bottom = defaults.bottom;
          state.underwear = defaults.underwear;
        } else if (kind === 'underwear') {
          state.hair = defaults.hair;
          state.top = 'none';
          state.outerwear = 'none';
          state.bottom = 'none';
          state.underwear = defaults.underwear;
        } else if (kind === 'nude') {
          state.hair = 'none';
          state.top = 'none';
          state.outerwear = 'none';
          state.bottom = 'none';
          state.underwear = 'none';
        }
        buildPanel();
        reloadAvatar();
      }

      function randomize() {
        const pick = (items) => items[Math.floor(Math.random() * items.length)];
        const defaults = MODELS[state.model].defaults;
        state.skin = pick(SKIN_TONES).id;
        state.hairColor = pick(PALETTE).id;
        state.topColor = pick(PALETTE).id;
        state.bottomColor = pick(PALETTE).id;
        state.hair = Math.random() < 0.85 ? defaults.hair : 'none';
        state.top = Math.random() < 0.8 ? defaults.top : 'none';
        state.outerwear = 'none';
        state.bottom = Math.random() < 0.8 ? defaults.bottom : 'none';
        state.underwear = Math.random() < 0.7 ? defaults.underwear : 'none';
        state.height = Math.round((0.9 + Math.random() * 0.25) * 100) / 100;
        buildPanel();
        reloadAvatar();
      }

      function buildPanel() {
        controls.replaceChildren();
        const model = MODELS[state.model];

        const modelSection = section('Modelo');
        addSelect(
          modelSection,
          'Modelo',
          'model',
          Object.entries(MODELS).map(([id, item]) => ({ id, label: item.label })),
          (value) => setModel(value),
        );

        const animationSection = section('Animação');
        addSelect(animationSection, 'Clipe', 'anim', ANIMATIONS, (value) => {
          state.anim = value;
          playing = true;
          playAnimation();
          updateUrl();
        });

        const skinSection = section('Pele');
        addSwatches(skinSection, 'Tom', 'skin', SKIN_TONES, () => {
          applyColors();
          refreshSwatches();
          updateUrl();
        });
        const heightRow = document.createElement('div');
        heightRow.className = 'row';
        const heightLabel = document.createElement('label');
        heightLabel.textContent = 'Altura';
        const heightValue = document.createElement('span');
        heightValue.className = 'value';
        heightValue.textContent = `${state.height.toFixed(2)}×`;
        const height = document.createElement('input');
        height.type = 'range';
        height.min = '0.85';
        height.max = '1.2';
        height.step = '0.01';
        height.value = String(state.height);
        height.addEventListener('input', () => {
          state.height = Number.parseFloat(height.value);
          heightValue.textContent = `${state.height.toFixed(2)}×`;
          applyHeight();
          updateUrl();
        });
        const heightBox = document.createElement('div');
        heightBox.append(height, heightValue);
        heightBox.style.display = 'grid';
        heightBox.style.gridTemplateColumns = '1fr auto';
        heightBox.style.gap = '6px';
        heightBox.style.alignItems = 'center';
        heightRow.append(heightLabel, heightBox);
        skinSection.append(heightRow);

        const eyeSection = section('Olhos');
        addSwatches(eyeSection, 'Cor', 'eyeColor', EYE_COLORS, () => {
          state.eyeColorHex = undefined;
          applyColors();
          refreshSwatches();
          updateUrl();
        });
        const eyePickRow = document.createElement('div');
        eyePickRow.className = 'row';
        const eyePickLabel = document.createElement('label');
        eyePickLabel.textContent = 'Personalizada';
        const eyePick = document.createElement('input');
        eyePick.type = 'color';
        eyePick.value =
          state.eyeColorHex || (byId(EYE_COLORS, state.eyeColor) || EYE_COLORS[0]).hex;
        eyePick.addEventListener('input', () => {
          state.eyeColorHex = eyePick.value;
          applyColors();
          updateUrl();
        });
        eyePickRow.append(eyePickLabel, eyePick);
        eyeSection.append(eyePickRow);

        const hairSection = section('Cabelo');
        addSelect(hairSection, 'Estilo', 'hair', model.parts.hair, (value) => {
          state.hair = value;
          reloadAvatar();
        });
        addSwatches(hairSection, 'Cor', 'hairColor', PALETTE, () => {
          applyColors();
          refreshSwatches();
          updateUrl();
        });

        const topSection = section('Camiseta / top');
        addSelect(topSection, 'Peça', 'top', model.parts.top, (value) => {
          state.top = value;
          reloadAvatar();
        });
        addSwatches(topSection, 'Cor', 'topColor', PALETTE, () => {
          applyColors();
          refreshSwatches();
          updateUrl();
        });

        const outerwearSection = section('Casaco / sobreposição');
        addSelect(outerwearSection, 'Peça', 'outerwear', model.parts.outerwear, (value) => {
          state.outerwear = value;
          reloadAvatar();
        });
        addSwatches(outerwearSection, 'Cor', 'topColor', PALETTE, () => {
          applyColors();
          refreshSwatches();
          updateUrl();
        });

        const bottomSection = section('Calça / short');
        addSelect(bottomSection, 'Peça', 'bottom', model.parts.bottom, (value) => {
          state.bottom = value;
          reloadAvatar();
        });
        addSwatches(bottomSection, 'Cor', 'bottomColor', PALETTE, () => {
          applyColors();
          refreshSwatches();
          updateUrl();
        });

        const underwearSection = section('Roupa íntima');
        addSelect(underwearSection, 'Peça', 'underwear', model.parts.underwear, (value) => {
          state.underwear = value;
          reloadAvatar();
        });
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent =
          'A roupa íntima combina com a peça de baixo e o top (camadas independentes). A cor da peça segue a cor de baixo.';
        underwearSection.append(note);

        const presetSection = section('Presets');
        const presetButtons = document.createElement('div');
        presetButtons.className = 'buttons';
        for (const [kind, label] of [
          ['complete', 'Completo'],
          ['underwear', 'Íntimo'],
          ['nude', 'Sem roupa'],
        ]) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = label;
          button.addEventListener('click', () => applyPreset(kind));
          presetButtons.append(button);
        }
        const randomButton = document.createElement('button');
        randomButton.type = 'button';
        randomButton.textContent = 'Aleatório';
        randomButton.className = 'primary';
        randomButton.addEventListener('click', randomize);
        presetButtons.append(randomButton);
        presetSection.append(presetButtons);

        const sceneNote = document.createElement('p');
        sceneNote.className = 'note';
        sceneNote.textContent =
          'Câmera fixa do closet (Home); os focos de câmera ficam no topo à esquerda. Este painel cobre as opções nativas do 3DX já importadas.';
        presetSection.append(sceneNote);
      }

      function updateUrl() {
        const next = new URLSearchParams();
        next.set('model', state.model);
        next.set('anim', state.anim);
        next.set('skin', state.skin);
        next.set('eyes', state.eyeColor);
        if (state.eyeColorHex) next.set('eyeHex', state.eyeColorHex);
        next.set('height', state.height.toFixed(2));
        next.set('hair', state.hair);
        next.set('hairColor', state.hairColor);
        next.set('top', state.top);
        next.set('topColor', state.topColor);
        next.set('outerwear', state.outerwear);
        next.set('bottom', state.bottom);
        next.set('bottomColor', state.bottomColor);
        next.set('underwear', state.underwear);
        next.set('focus', state.focus);
        history.replaceState(null, '', `?${next.toString()}`);
      }

      // ---------------------------------------------------------------------------
      // Start
      // ---------------------------------------------------------------------------
      const fromGame = params.get('from') === 'game';
      const backButton = document.getElementById('back');
      backButton.textContent = fromGame ? 'Voltar ao jogo' : 'Voltar';
      backButton.addEventListener('click', () => {
        if (fromGame && history.length > 1) history.back();
        else window.location.href = '/';
      });
      buildFocusBar();
      buildPanel();
      setFocus(state.focus, true);
      canvas.addEventListener('pointerdown', () => {
        playing = !playing;
        for (const group of active.groups) {
          if (playing) group.play(true);
          else group.pause();
        }
        hud.innerHTML = playing
          ? '<strong>Closet 3DX — Home</strong><br />câmera fixa · focos no topo · clique para play/pause'
          : '<strong>Closet 3DX — Home</strong><br />pausado · clique para continuar';
      });
      document.getElementById('panelToggle').addEventListener('click', () => {
        panel.classList.toggle('open');
      });
      engine.runRenderLoop(() => {
        if (cameraGoal) {
          const t = Math.min(1, engine.getDeltaTime() / 140);
          camera.position = BABYLON.Vector3.Lerp(camera.position, cameraGoal.position, t);
          cameraTarget = BABYLON.Vector3.Lerp(cameraTarget, cameraGoal.target, t);
          camera.setTarget(cameraTarget);
          camera.fov += (cameraGoal.fov - camera.fov) * t;
        }
        scene.render();
      });
      window.addEventListener('resize', () => engine.resize());
      loadRoom();
      reloadAvatar();
    </script>
  </body>
</html>
